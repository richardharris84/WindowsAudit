name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue for Windows Audit! Please include
            your Windows version (10 or 11), how you installed the app
            (WindowsAudit-Setup.exe or MSIX), and the steps that led to the
            problem. If the issue involves a scan or report, attaching the
            relevant `Win-Srv-Eval-Report.md` section helps a lot. A maintainer
            will take a look soon.
          pr_message: >
            Thanks for your first pull request to Windows Audit! Please make sure
            the solution builds (`dotnet build WindowsServiceAudit.slnx`) and the
            tests pass (`dotnet test`). The CI workflow will verify this
            automatically. We appreciate the contribution!
