name: AI Issue Summary

on:
  issues:
    types: [opened]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Copilot configuration
        id: copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AI summary skipped. Configure COPILOT_PAT with Copilot Requests permission and an active Copilot subscription."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.copilot.outputs.enabled == 'true'
        with:
          node-version: '24'

      - name: Install Copilot CLI
        if: steps.copilot.outputs.enabled == 'true'
        run: npm install --global @github/copilot@1.0.105

      - name: Summarize issue with GitHub Copilot
        if: steps.copilot.outputs.enabled == 'true'
        id: ai
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          provider: copilot
          model: ''
          system-prompt: >
            You are a triage assistant for Windows Audit, a Windows 10/11 desktop
            app (WPF, .NET) that inventories Windows services, compares their
            executable paths against a user-editable whitelist, and produces CSV
            and Markdown/DOCX reports. It never starts, stops, or disables
            services. Summarize new GitHub issues for maintainers.
          prompt: |
            Summarize the following GitHub issue in 3 short bullet points:
            what the user reports, the likely affected area (scan, whitelist,
            report/export, installer/MSIX, UI, or docs), and any missing
            information the maintainer should request. Keep it under 120 words.

            Title: ${{ github.event.issue.title }}

            Body:
            ${{ github.event.issue.body }}

      - name: Post summary comment
        if: steps.copilot.outputs.enabled == 'true' && steps.ai.outputs.response != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          gh issue comment "$ISSUE_URL" --body "## 🤖 AI Summary

          $RESPONSE

          ---
          _Generated automatically by GitHub Copilot. May contain mistakes._"
