name: PSScriptAnalyzer

on:
  push:
    branches: [ master ]
    paths: [ '**.ps1', '.github/workflows/psscriptanalyzer.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ '**.ps1', '.github/workflows/psscriptanalyzer.yml' ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer completed: $(@($results).Count) warning(s), 0 errors."
