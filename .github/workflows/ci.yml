name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WindowsServiceAudit.slnx

      - name: Build
        run: dotnet build WindowsServiceAudit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WindowsServiceAudit.slnx --configuration Release --no-build --verbosity normal
